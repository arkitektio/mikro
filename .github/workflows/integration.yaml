name: Integration Tests
on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]
jobs:
  test_integration:
    # The backend image is `:latest` -- the released line -- for every branch.
    # To run against another published tag, set the repository variable of the same
    # name (Settings -> Secrets and variables -> Actions -> Variables) to e.g. `next`;
    # nothing here needs editing. The compose file defaults to `:latest` too, so a
    # local `pytest -m integration` and CI agree unless you opt out.
    env:
      MIKRO_SERVICE_TAG: ${{ vars.MIKRO_SERVICE_TAG || 'latest' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}

      - name: Install the project
        run: uv sync --all-extras --dev

      - name: Run tests
        run: uv run pytest -m integration
