name: Integration Tests
on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]
jobs:
  test_integration:
    # Pinned to :next, the only tag jhnnsrs/mikro publishes -- there has never
    # been a :latest. The previous expression asked for it on main, so the image
    # pull failed and every integration run on the stable line was broken.
    # Restore the 'main -> latest' split once the backend cuts a stable image.
    env:
      MIKRO_SERVICE_TAG: next
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}

      - name: Install the project
        run: uv sync --all-extras --dev

      - name: Run tests
        run: uv run pytest -m integration
