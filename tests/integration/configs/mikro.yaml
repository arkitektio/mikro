django:
  admin:
    email: admin@admin.com
    password: admin
    username: admin
  debug: true
  hosts:
    - "*"
  secret_key: ab94ec351412c22324b2f635e0d6b9dd
authentikate:
  # Required since authentikate 4.0: without it the server refuses to boot, and a
  # token an issuer minted for some other service would otherwise be accepted here.
  audience: mikro
  issuers:
    - kind: rsa
      iss: lok
      kid: lok-key-1
      public_key: ssh-rsa 
  static_tokens:
    test:
      sub: 1
      iss: lok
      org: test
      client_id: test
      client_app: test
      client_release: v0.0.1
      client_device: test
lok:
  issuer: lok
  key_type: RS256
  public_key: ssh-rsa 
redis:
  host: redis
  port: 6379
datalayer:
  # The server mints scoped STS credentials per grant and refuses to hand out its own
  # permanent key when it cannot. MinIO ignores the ARN itself and scopes the session
  # by the inline policy alone, so any ARN-shaped string does.
  role_arn: arn:aws:iam::000000000000:role/mikro
  access_key: mikro_access_key
  secret_key: mikro_secret_key
  host: rustfs
  port: 9000
  protocol: http
  media:
    bucket: media
  zarr:
    bucket: zarr
  parquet:
    bucket: parquet
  bigfile:
    bucket: bigfile
  # The mesh and network stores, without which get_bucket_config("fabriks"/
  # "konnektion") refuses every mesh/network collection upload. The example tests
  # are the first integration exercise of those paths.
  fabriks:
    bucket: fabriks
  konnektion:
    bucket: konnektion
postgres:
  db_name: mikro
  engine: django.db.backends.postgresql
  host: db
  password: hello_django
  port: 5432
  username: hello_django
scopes:
  mikro_read: Read image from the database
  mikro_write: Write image to the database
