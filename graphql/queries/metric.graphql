query GetMetric($id: ID!) {
  metric(id: $id) {
    ...Metric
  }
}

# What a port's picker asks: `$requires` is the port's own constraints, handed on
# unchanged. A metric has no name, so it is searched and labelled by its key.
query SearchMetrics(
  $search: String
  $values: [ID!]
  $requires: [DescriptorConstraintInput!]
  $limit: Int
  $offset: Int = 0
) {
  options: metrics(
    filters: { key: { iContains: $search }, ids: $values, requires: $requires }
    pagination: { limit: $limit, offset: $offset }
  ) {
    value: id
    label: key
  }
}

query ListMetrics($filters: MetricFilter, $pagination: OffsetPaginationInput) {
  metrics(filters: $filters, pagination: $pagination) {
    ...Metric
  }
}
