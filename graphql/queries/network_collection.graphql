query GetNetworkCollection($id: ID!) {
  networkCollection(id: $id) {
    ...NetworkCollection
  }
}

query GetNetworkCollections(
  $filters: NetworkCollectionFilter
  $pagination: OffsetPaginationInput
) {
  networkCollections(filters: $filters, pagination: $pagination) {
    ...NetworkCollection
  }
}

query SearchNetworkCollections(
  $search: String
  $values: [ID!]
  $limit: Int
  $offset: Int = 0
) {
  options: networkCollections(
    filters: { search: $search, ids: $values }
    pagination: { limit: $limit, offset: $offset }
  ) {
    value: id
    label
  }
}
