mutation RequestFabriksUpload {
  requestFabriksUpload {
    ...FabriksUploadGrant
  }
}


# Reads the store's `fabriks.json` and refuses a prefix without one -- which is exactly what an
# interrupted upload looks like, since the manifest is written last. So this is the completion
# protocol, not a formality, and the store it returns carries the grid and encoding it read.
mutation FinishFabriksUpload($input: FinishFabriksUploadInput!) {
  finishFabriksUpload(input: $input) {
    ...FabriksStore
  }
}


mutation RequestFabriksAccess($input: RequestFabriksAccessInput!) {
  requestFabriksAccess(input: $input) {
    ...FabriksAccessGrant
  }
}


# Reissues credentials for an upload still in flight, to the same key: a write that outlives its
# credentials asks for this before they expire and carries on. Only the uploader may.
mutation RefreshFabriksUpload($input: RefreshUploadInput!) {
  refreshFabriksUpload(input: $input) {
    ...FabriksUploadGrant
  }
}
