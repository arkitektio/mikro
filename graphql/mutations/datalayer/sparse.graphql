mutation RequestSparseUpload {
  requestSparseUpload {
    ...SparseUploadGrant
  }
}


mutation FinishSparseUpload($input: FinishSparseUploadInput!) {
  finishSparseUpload(input: $input) {
    ...SparseStore
  }
}


# Reissues credentials for an upload still in flight, to the same key: a write that outlives its
# credentials asks for this before they expire and carries on. Only the uploader may.
mutation RefreshSparseUpload($input: RefreshUploadInput!) {
  refreshSparseUpload(input: $input) {
    ...SparseUploadGrant
  }
}
