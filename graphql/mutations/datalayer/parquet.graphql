mutation RequestParquetUpload($input: RequestParquetUploadInput!) {
  requestParquetUpload(input: $input) {
    ...ParquetUploadGrant
  }
}


mutation FinishParquetUpload($input: FinishParquetUploadInput!) {
  finishParquetUpload(input: $input) {
      ...ParquetStore
  }
}

mutation RequestParquetAccess($input: RequestParquetAccessInput!) {
  requestParquetAccess(input: $input) {
    ...ParquetAccessGrant
  }
}


# Reissues credentials for an upload still in flight, to the same key: a write that outlives its
# credentials asks for this before they expire and carries on. Only the uploader may.
mutation RefreshParquetUpload($input: RefreshUploadInput!) {
  refreshParquetUpload(input: $input) {
    ...ParquetUploadGrant
  }
}
