mutation RequestMediaUpload($input: RequestMediaUploadInput!) {
  requestMediaUpload(input: $input) {
    ...MediaUploadGrant
  }
}


mutation FinishMediaUpload($input: FinishMediaUploadInput!) {
  finishMediaUpload(input: $input) {
      ...MediaStore
  }
}


mutation RequestMediaAccess($input: RequestMediaAccessInput!) {
  requestMediaAccess(input: $input) {
     ...MediaAccessGrant
  }
}


# Reissues credentials for an upload still in flight, to the same key: a write that outlives its
# credentials asks for this before they expire and carries on. Only the uploader may.
mutation RefreshMediaUpload($input: RefreshUploadInput!) {
  refreshMediaUpload(input: $input) {
    ...MediaUploadGrant
  }
}
