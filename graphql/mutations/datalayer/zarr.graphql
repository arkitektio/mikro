mutation RequestZarrUpload($input: RequestZarrUploadInput!) {
  requestZarrUpload(input: $input) {
    ...ZarrUploadGrant
  }
}


mutation FinishZarrUpload($input: FinishZarrUploadInput!) {
  finishZarrUpload(input: $input) {
      ...ZarrStore
  }
}


mutation RequestZarrAccess($input: RequestZarrAccessInput!) {
  requestZarrAccess(input: $input) {
    ...ZarrAccessGrant
  }
}


# Reissues credentials for an upload still in flight, to the same key: a write that outlives its
# credentials asks for this before they expire and carries on. Only the uploader may.
mutation RefreshZarrUpload($input: RefreshUploadInput!) {
  refreshZarrUpload(input: $input) {
    ...ZarrUploadGrant
  }
}
