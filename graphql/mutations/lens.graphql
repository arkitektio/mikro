# Every create here is get-or-create: a lens is one row per container and normalized
# selection, so asking for the same selection twice answers with the same id.
mutation CreateLens($input: CreateLensInput!) {
  createLens(input: $input) {
    ...ArrayLens
  }
}

mutation CreateTableLens($input: CreateTableLensInput!) {
  createTableLens(input: $input) {
    ...TableLens
  }
}

mutation CreateSparseLens($input: CreateSparseLensInput!) {
  createSparseLens(input: $input) {
    ...SparseLens
  }
}

mutation CreateMeshLens($input: CreateMeshLensInput!) {
  createMeshLens(input: $input) {
    ...MeshLens
  }
}

mutation CreateNetworkLens($input: CreateNetworkLensInput!) {
  createNetworkLens(input: $input) {
    ...NetworkLens
  }
}

# A clip box, in the model's own axes and unit.
mutation CreateFixtureLens($input: CreateFixtureLensInput!) {
  createFixtureLens(input: $input) {
    ...FixtureLens
  }
}

mutation CreateAnnotationLens($input: CreateAnnotationLensInput!) {
  createAnnotationLens(input: $input) {
    ...AnnotationLens
  }
}

# A lens has no name of its own: this names the positions it pins (a channel, a frame), and
# every lens pinning them -- its crops, the sub-lens a scene draws the channel through -- is
# called by it. Null or blank removes the name, and what ingest recorded names them again.
mutation SetPositionLabel($input: SetPositionLabelInput!) {
  setPositionLabel(input: $input) {
    id
    name
    label
    kind
  }
}

mutation SetLensDefaultScene($input: SetLensDefaultSceneInput!) {
  setLensDefaultScene(input: $input) {
    id
    kind
    defaultScene {
      id
      name
    }
  }
}

# Refused for a container's whole lens, and while a layer draws through the lens.
mutation DeleteLens($input: DeleteLensInput!) {
  deleteLens(input: $input)
}
