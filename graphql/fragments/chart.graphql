# A chart is the second composition beside a scene: a scene shows *where* (every screen axis a
# world axis, values as appearance), a chart shows *how much* (values as position, at most one
# axis drawn from its world). Every chart has a world -- the domain its layers' rows live in --
# and every layer is placed into it (`placement`, `asAffine`). An AXIS chart draws its world's
# one metric axis and lays TRACE, SERIES and ANNOTATION layers along it (`alongAxis`); a VALUES
# chart's world is whose rows (a table's space, not drawn), and its POINTS and DISTRIBUTION
# layers draw those rows at the values of the columns they name.
#
# The kinds are inlined rather than spread as named fragments, for the reason spelled out
# on the scene's `Layer` fragment: a nested fragment spread inside an *interface* fragment
# breaks the generated module's import.
fragment ChartLayer on ChartLayer {
  id
  kind
  name
  chart {
    id
    name
  }
  visible
  order
  opacity
  color
  # Derived on read, all four. `alongAxis` is the source axis the registration lays along
  # the chart, so it follows the edge: null once the layer is no longer placed.
  alongAxis
  placement
  placementValidity
  asAffine {
    matrix
    inputAxes
    outputAxes
    total
    fields {
      outputAxis
      inner
      base
      component
      scale
      offset
      inputAxis
      innerScale
      innerOffset
      dataset {
        id
      }
    }
  }
  ... on TraceChartLayer {
    lens {
      id
      dataset {
        id
        name
      }
    }
    # The CHANNEL or INDEX axis left free beside `alongAxis`: one line per position.
    seriesAxis
    mark
    lineWidth
    markerSize
    markerShape
  }
  ... on SeriesChartLayer {
    # The table lens the series draws through; `windows` is empty for the whole table.
    tableLens: lens {
      id
      name
      windows {
        axis
        min
        max
      }
    }
    tableDataset {
      id
      name
    }
    valueColumn
    coordinateColumn
    valueUnit
    mark
    lineWidth
    markerSize
    markerShape
  }
  ... on PointsChartLayer {
    # The table lens whose rows are drawn; a window on a numeric column is a gate.
    pointsLens: lens {
      id
      name
      windows {
        axis
        min
        max
      }
    }
    pointsTable: tableDataset {
      id
      name
    }
    xColumn
    yColumn
    zColumn
    xUnit
    yUnit
    zUnit
    pointsMark: mark
    pointsLineWidth: lineWidth
    pointsMarkerSize: markerSize
    pointsMarkerShape: markerShape
  }
  ... on DistributionChartLayer {
    distributionLens: lens {
      id
      name
      windows {
        axis
        min
        max
      }
    }
    distributionTable: tableDataset {
      id
      name
    }
    distributionValueColumn: valueColumn
    distributionLineWidth: lineWidth
    groupColumn
    bins
    distributionValueUnit: valueUnit
    distributionMark: mark
  }
  ... on AnnotationChartLayer {
    annotationLens: lens {
      id
      name
      windows {
        axis
        min
        max
      }
    }
    annotationCollection {
      id
      name
    }
  }
}

fragment Chart on Chart {
  id
  name
  description
  # How the layers share the screen, remembered: a row or panel each (STACKED), overlaid where
  # they read their axes alike (SHARED), or every along-axis layer in one plot (OVERLAY).
  layout
  # The world's one measured axis, which along-axis layers are laid along. Null when the world
  # is not one (a table's rows): then only value layers draw here.
  axis {
    ...Axis
  }
  worldCoordinateSystem {
    ...CoordinateSystem
  }
  layers {
    ...ChartLayer
  }
}
