fragment Transformation on Transformation {
  id
  kind
  name
  version
  input {
    ...CoordinateSystem
  }
  output {
    ...CoordinateSystem
  }
  ... on ScaleTransformation {
    scale
  }
  ... on TranslationTransformation {
    translation
  }
  ... on AffineTransformation {
    affine
  }
  ... on RotationTransformation {
    affine
  }
  ... on MapAxisTransformation {
    inputAxes
    outputAxes
  }
  ... on FieldTransformation {
    field {
      ...CoordinateSystem
    }
  }
  # A SEQUENCE carries its map on itself: ordered steps, each a kind and that kind's
  # parameters in the axis order of the sequence's input. A step is not an edge -- no id, no
  # endpoints -- so there is nothing further to fetch, and the whole matrix composes from this.
  ... on SequenceTransformation {
    steps {
      kind
      scale
      translation
      affine
      reason
      field {
        id
      }
    }
  }
  # A BY_DIMENSION states its map over the axes it names: a scale and/or a translation, or an
  # affine. All three empty is the identity on those axes.
  ... on ByDimensionTransformation {
    inputAxes
    outputAxes
    scale
    translation
    affine
  }
}
