# A fabriks store is a whole prefix rather than one object, and the grant covers it: the
# manifest, both catalogs and every level under one set of credentials, with read and delete
# inside it because the tree is written incrementally and `fabriks.json` lands last.
fragment FabriksUploadGrant on FabriksUploadGrant {
  accessKey
  secretKey
  sessionToken
  path
  key
  bucket
  expiresIn
  maxBytes
  store
}

