fragment Annotation on Annotation {
  id
  name
  kind
  vectors
  coordinates {
    name
    value
  }
  coordinateSystem {
    ...CoordinateSystem
  }
  intrinsicBbox {
    min
    max
  }
  strokeColor
  fillColor
  strokeWidth
  filled
  sourceIds
  tracedOn {
    id
  }
}

fragment AnnotationCollection on AnnotationCollection {
  id
  name
  description
  coordinateSystem {
    ...CoordinateSystem
  }
  annotations {
    ...Annotation
  }
}

fragment AnnotationDerivation on AnnotationDerivation {
  id
  relation
  reason
  createdAt
  source {
    id
    name
    kind
  }
  child {
    id
    name
    kind
  }
}
