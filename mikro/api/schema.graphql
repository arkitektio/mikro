"""
A physical quantity of any dimension (``"0.12 S/cm2"``, ``"-54.3 mV"``, ``"2 mM"``).

Unlike the dimension-locked scalars, this keeps whatever unit the value
carries and does not normalize to a canonical integer — its dimension is
whatever the value has. A bare number without a unit is rejected. On the wire
it is a string; validating it against an expected dimension (e.g. a declared
mechanism parameter) is the caller's job.
"""
scalar GenericQuantity

enum Granularity {
  HOUR
  DAY
  WEEK
  MONTH
  QUARTER
  YEAR
}

"""
The fields a GRAPH member of a colour picker entry reads: a per-node value the network collection itself carries. Published for codegen; the wire type is the flat NetworkColorByInput -- and only that one, because a mask and a mesh have no per-node values to read
"""
input GraphColorByInput @unionElementOf(union: "NetworkColorByInput", discriminator: "kind", key: "GRAPH") {
  colormap: ColorMap = null
  min: Float = null
  max: Float = null
  label: String = null
  kind: ColorSourceKind! = GRAPH
  attribute: String!
  target: GraphTarget! = NODE
}

"""
Which of a network's two row sets a GRAPH colouring or rule addresses. A network is the one layer kind with two -- every other source has exactly one set of objects -- and an edge has no durable identity of its own (simplification re-links edges between levels), so an edge's value is *derived*: it takes its start node's value, the same convention the renderer already uses for an edge's object ordinal
"""
enum GraphTarget {
  """
  Every node, and the segments and glyphs that touch it: a segment takes its start node's value, so colouring nodes colours the wireframe too.
  """
  NODE

  """
  Segments only, each taking its start node's value; node glyphs keep the layer's base colour. The honest per-edge statement, since an edge owns no value of its own.
  """
  EDGE
}

"""The type of change that was made."""
enum HistoryKind {
  CREATE
  UPDATE
  DELETE
}

"""
One step of a plan's chain through record-land. `hops[0]` is the landing -- the FIELD edge's own target, bound from `sample` -- and every later hop binds from the rows or slice its `parent` returned, under the name `via` states, and lands one declared reference further: a `Column.references`, a matrix axis a table identifies, or the same axis walked into the matrix. Execute in list order; a hop's parent always precedes it. `cardinality` says whether to bind a scalar or a list. The server describes the chain and reads nothing; the client runs it hop by hop with grants it already holds
"""
type Hop {
  """This hop's position in `hops`, what a child names as its `parent`"""
  index: Int!

  """
  The hop whose result this one binds from. Null only on `hops[0]`, which binds from `sample`
  """
  parent: Int

  """
  ONE: bind each key as a scalar. MANY: bind each as a list (every position a SPARSE parent returned) and expect the keys back per row. A floor: a ONE lookup may still return several rows
  """
  cardinality: HopCardinality!

  """
  The declared reference this hop crosses. Null on `hops[0]`, whose crossing is the plan's `edge`
  """
  via: HopVia

  """
  The table this hop lands in: the home of its attributes and their `references`. One or the other with `sparseDataset`, never both
  """
  table: TableDataset

  """The matrix this hop lands in, when `lookup.kind` is SPARSE"""
  sparseDataset: SparseDataset

  """
  How to read what this hop lands in: the rows of a parquet or a slice of a matrix
  """
  lookup: LookupStep!

  """
  The picker's name for this hop: the `(table, column)` reference steps from the landing table to here, exactly what a layer's `colorBys[].joinPath` stores -- so a stored colouring finds the hop that resolves it, and its key column, here. Empty on `hops[0]`, and empty once the chain has crossed a matrix, which no `joinPath` can name
  """
  joinPath: [ColumnOptionJoinStep!]!
}

"""
How a hop's key values are bound. ONE: the worker holds a scalar per key -- the hover shape -- and binds it as one. MANY: it holds a set (every position a SPARSE step returned) and binds a list, and the lookup returns the key columns with each row so a row says which value it answers. A floor, not a guarantee: a ONE lookup can still return several rows, and a client that collected several parents may execute a ONE step as MANY
"""
enum HopCardinality {
  """
  The bound value is a scalar: one id from the sample, or one row's column from the parent hop.
  """
  ONE

  """
  The bound value is a set: every position a SPARSE parent returned, or every row a MANY parent did. Bind a list; the keys come back per row.
  """
  MANY
}

"""
The schema fact one hop crosses. `column`: a `Column.references` hop -- the parent row's column whose values are row ids of the next table -- or, on a hop into a matrix, the parent table's INDEX column whose values are positions along `axis`. `axis`: the matrix axis crossed, in either direction. Whichever is set, its name is the name the hop's lookup binds under (`keyColumns[].axis` / `keyHeld`)
"""
type HopVia {
  """
  The column whose values are bound: the parent row's reference column, or its INDEX column when the hop enters a matrix
  """
  column: Column

  """
  The matrix axis crossed: the parent slice's value axis when the hop leaves a matrix, the target's indexed axis when it enters one
  """
  axis: String
}

"""
What a column's values or an axis' positions **are**, as a discriminated union: `kind` selects which sort of thing is being named, and only that member's id field is read -- any other is rejected. Carried by a sparse dataset's axes and by a table's columns alike -- the one spelling of every 'values here identify things there' claim. `DATASET`, `MESH_COLLECTION` and `NETWORK_COLLECTION` author a FIELD edge from the source into this data, which is also what makes it reachable from a layer over that source (INDEX axes only -- the edge produces an axis); `TABLE` authors no edge and states a foreign key instead, on an INDEX axis or a plain data column; `NETWORK_COLLECTION_NODES` likewise authors none, on an INDEX axis scoped by a sibling object axis
"""
input IdentificationInput {
  """
  Which sort of thing identifies this column or axis. It fixes which id field below is read; any other is rejected
  """
  kind: IdentificationKind!

  """
  (DATASET) The label dataset whose pixel values are the positions along this axis. Its own pixel grid is both the edge's input and its field, which is what a label mask is
  """
  dataset: ID = null

  """
  (MESH_COLLECTION) The mesh collection whose geometry rows carry the positions. Its vertex space is both the edge's input and its field, exactly as a mask's grid is
  """
  meshCollection: ID = null

  """
  (NETWORK_COLLECTION) The network collection whose **object** ids are the positions along this axis -- one per traced object, never per node; its coordinate system is both the edge's input and its field, exactly as a mesh collection's is. (NETWORK_COLLECTION_NODES) The collection whose **node** ids they are instead -- no edge, scoped by a sibling INDEX axis keyed by the same collection's objects; two such axes over one collection are its edges' (source, target), in axis declaration order. One field for both kinds because the id names the same sort of thing and `kind` already says which claim is being made
  """
  networkCollection: ID = null

  """
  (TABLE) The table whose rows this column's values are -- an INDEX axis' enumeration, or a plain data column's foreign key (an `instance_id` referencing a table of tracks: the edge of the join graph `colorBys` walks). Must be keyed by exactly one INDEX coordinate column, which is where a value is looked up -- the contract `Column.references` records. A matrix with 19 059 features costs one picker entry because of this, not 19 059
  """
  table: ID = null

  """
  What to call the edge this authors, in a graph a person has to read. Defaults to `<source> -> <dataset>`. Only meaningful for the kinds that author one
  """
  name: String = null

  """
  How far the edge this authors may be trusted. Only meaningful for the kinds that author one
  """
  validity: PlacementValidity = null
}

"""
How one axis is identified -- the discriminator of `IdentificationInput`, and the same question whether the axis belongs to a sparse matrix or to a table. An axis of positions means nothing until something says what those positions *are*, and there are exactly these five ways to answer. Three of them author a FIELD edge, which is also what makes the data reachable from a layer over that source; `TABLE` and `NETWORK_COLLECTION_NODES` author none -- a table states a foreign key, and a node axis states which collection's nodes it enumerates, scoped by the sibling axis that collection's objects key
"""
enum IdentificationKind {
  """
  A label mask, through its intrinsic pixel grid: its pixel values are the positions along this axis. Authors a FIELD edge, so it is also what makes the data reachable from a layer over that mask.
  """
  DATASET

  """
  A mesh collection, through its vertex coordinate system: the ids ride on the geometry rows, so a client that picked a surface is already holding one. Authors a FIELD edge, exactly as DATASET does.
  """
  MESH_COLLECTION

  """
  A network collection, through its coordinate system, identified by its **object** ids -- one row per traced object (a filament, an arbor, a vessel tree), never per node. The object ids ride on the geometry rows and the object catalog, so a client that picked a wireframe is already holding one. Authors a FIELD edge, exactly as MESH_COLLECTION does. A per-node identification is the sibling member NETWORK_COLLECTION_NODES: a node id is unique only within its object, so it cannot key a row on its own.
  """
  NETWORK_COLLECTION

  """
  A network collection's **node** ids -- the values along this axis are node ids, scoped by a sibling INDEX axis keyed by the same collection's object ids (a node id is unique only within its traced object, so the pair is the row's key). Authors no edge, like TABLE, and for the same reason: the object axis' edge already supplies the one id an edge supplies, and this says what the *other* axis enumerates. One such axis makes the table per-node; two over one collection make it per-edge, (source, target) in axis declaration order. Node ids survive every octree level; edge rows resolve exactly at level 0 and on pruned levels and are void on simplified ones, where edges are re-linked chords.
  """
  NETWORK_COLLECTION_NODES

  """
  A table whose rows this axis' positions are -- the relation `Column.references` carries, said of the axis. Authors no edge and touches no coordinate system: a table is already in record-land, where the relation is a foreign key rather than a map between spaces. It is what lets a FIELD edge land beside it, because an axis identified this way is one the edge is not expected to supply. Valid on an INDEX axis only: a SPACE or TIME coordinate's values are positions, and a position in nanometres and a row id are different things.
  """
  TABLE
}

"""
The fields an IDENTITY member of TransformInput reads -- only the discriminator, the map having no parameters. Published for codegen; the wire type is the flat TransformInput
"""
input IdentityTransformInput @unionElementOf(union: "TransformInput", discriminator: "kind", key: "IDENTITY") {
  kind: CreatableTransformKind! = IDENTITY
}

"""The identity map: input and output coordinates are the same"""
type IdentityTransformation implements Transformation @key(fields: "id", resolvable: true) {
  id: ID!
  kind: TransformKind!
  name: String
  input: CoordinateSystem
  output: CoordinateSystem

  """
  How much this map is actually known: VALIDATED for a map the server derived (or one someone checked), INFERRED for numbers read from metadata, MANUAL for an authored registration, UNKNOWN for one its author marked as a guess. A layer's validity is the weakest edge on its path to world
  """
  validity: PlacementValidity!

  """
  (derivation edges) What the operation this edge records did to the *values*, orthogonal to `kind`: IDENTICAL (a crop -- statistics transfer), TRANSFORMED (a deconvolution -- same quantity, new numbers), CATEGORIZED (a threshold -- values became labels, and a bootstrapped scene renders the data as a label map). Null when unstated, and never present on a registration -- values do not cross a claim between spaces
  """
  valueRelation: ValueRelation

  """
  Provenance entries for this edge: who authored it, and every refinement since. A refinement rewrites the edge in place, so this audit trail is where the placement's earlier states live -- and counting these rows along a chain is what `CoordinateSystem.transformVersion` reports
  """
  provenanceEntries(pagination: OffsetPaginationInput): [ProvenanceEntry!]!
  createdAt: DateTime!
  creator: User

  """
  How many times this edge has been written, counting the row that created it -- so a new edge reads 1. Only comparison is meaningful: this and the edge's `id` together are the cache key for anything derived from the edge, and a change means refetch. It counts the same provenance rows `provenanceEntries` lists, so the audit trail and the token cannot disagree; a rename moves it too, which errs towards refetching something that did not change rather than trusting something that did
  """
  version: Int!

  """
  Where along one axis this edge applies, or null for an edge that holds everywhere -- which is almost every edge. A per-channel correction is scoped to {axis: "c", index: 2}; several such edges over one axis are one piecewise map. A path query crosses a scoped edge only when it fixes that coordinate with `at`
  """
  selector: Selector

  """
  The names of the input axes this edge's parameters are ordered by. `scale`, `translation` and the columns of `affine` follow this order -- which is the input system's axis order, NOT the reading layer's axis names, and the two differ often enough that indexing the arrays against them silently misplaces them. A BY_DIMENSION edge names only the subset of axes it acts on; the axes it does not name are the ones it leaves untouched
  """
  inputAxes: [String!]!

  """
  The names of the output axes this edge produces. For a rank-changing BY_DIMENSION edge (placing a (c,y,x) dataset into a (t,z,y,x) world) this is the subset it maps onto; the world's other axes are untouched
  """
  outputAxes: [String!]!

  """
  Which geometric properties survive this edge's map, derived from `kind`: ISOMETRY (distances, angles and areas all transfer), SIMILARITY (angles and length ratios transfer, absolute lengths scale by one common factor), AFFINE (parallelism and area ratios transfer, angles and distances do not), DIFFEOMORPHIC (topology at best, and only locally -- the Jacobian varies with position), NONE (nothing corresponds). A SEQUENCE or BY_DIMENSION is the weakest of its children. Stated by kind, never by inspecting the numbers: an AFFINE edge reads AFFINE even when its matrix happens to be rigid, because separating those needs an SVD. A layer's `placementInvariance` is the minimum of this over its whole path to world
  """
  invariance: TransformInvariance!
}

"""
The `ImageFileLike` scalar type represents a reference to a snapshot image previously created by the user n a datalayer
"""
scalar ImageFileLike

"""
The general image layer: array (lens) data rendered through a composable render graph. The kind for a layer that actually **composites** -- several channels blended together, a hand-authored transfer curve, a solid tint, per-channel opacity. When the recipe's shape is fixed instead, one of IntensityLayer, RgbLayer or PhasorLayer says so directly and carries its settings as fields, which is why those are not this type with a flag. Its rendering is described entirely by the render graph; its placement, entirely by the coordinate graph.
"""
type ImageLayer implements Layer @key(fields: "id", resolvable: true) {
  id: ID!
  kind: LayerKind!
  name: String
  scene: Scene!
  blending: Blending!
  opacity: Float!
  visible: Boolean!
  order: Int!

  """
  The path of transformation edges from this layer's source coordinate system to its scene's world system. A layer belongs to exactly one scene, so this is the one 'to world' question with a single right answer -- the path uses the layer's dataset facts plus the world's registrations, which are the same for every scene over that space. Null when the layer is unregistered or has no source system; empty when the source already is the world system. Every step is here in full, with its own validity, invariance and provenance, which is what to ask for when you care *how* the data got placed; `asAffine` is the same path composed, for when you only need the map
  """
  pathToWorld(at: [CoordinateInput!] = null): [PlacementStep!]

  """
  This layer's whole `pathToWorld` composed into one affine map -- the same path, same edges, same order, with the flagged steps inverted. Derived on read and stored nowhere, exactly as the path itself is, so refining one registration moves it. **Null when `pathToWorld` is null** and for the same two reasons; `placement` is what tells them apart. It errors rather than returning null when a path exists but does not condense: a FIELD step gives its map as the values of an array and has no closed form, and a singular step cannot be walked backwards -- the error names the transformation that stopped it. Note that `placementInvariance` being AFFINE or stronger is necessary but not sufficient for this to succeed. `outputAxes` names only the destination axes the path constrains, so pass `strict: true` to be refused a partial map instead of handed one
  """
  asAffine(strict: Boolean! = false, at: [CoordinateInput!] = null): AffinePlacement

  """
  Whether this layer has a place in its scene's world, and if not, why not. A null `pathToWorld` means three different things -- nobody has registered this data yet, its geometry did not survive the operation that produced it and it can never be placed, or it is registered per index and you have not said which index -- and a client should not have to guess which. UNREGISTERED is a gap to close; UNMAPPABLE is a fact to badge; CONDITIONAL is a placement to ask again for with `at`. Pass the same `at` you would pass `pathToWorld` to be told about that coordinate. Derived, never stored
  """
  placement(at: [CoordinateInput!] = null): PlacementState!

  """
  How much this layer's placement is actually known: the weakest edge on its path to world. UNKNOWN while the path rests on an edge a client marked as guessed, and when there is no path at all; MANUAL once someone authored the registration; VALIDATED once it was checked, and by construction when the path is empty -- data in its own space is placed exactly. A layer placed per index reports one of its scoped routes rather than UNKNOWN; pass `at` for that coordinate's exact answer. Derived, never stored -- and distinct from a single edge's `validity`: this is the minimum over the whole path
  """
  placementValidity(at: [CoordinateInput!] = null): PlacementValidity!

  """
  Which geometric properties survive the whole walk from this layer's data to its scene's world: the weakest edge on its path. ISOMETRY means a distance measured in the data IS that distance in world; SIMILARITY means shapes and angles transfer and every length needs one common factor; AFFINE means only parallelism and area ratios do, so an angle or a distance read in the data means nothing in world; DIFFEOMORPHIC means nothing metric survives anywhere; NONE means there is no path at all. This is what says whether a scalar length in scene units (`pointSize`, `lineWidth`, a stroke width, a camera zoom) is well defined for this layer: it is, from SIMILARITY up. A layer placed per index reports one of its scoped routes rather than NONE; pass `at` for that coordinate's exact answer. Derived, never stored -- and distinct from a single edge's `invariance`, this being the minimum over the whole path. `placement` says which of the reasons a NONE layer has
  """
  placementInvariance(at: [CoordinateInput!] = null): TransformInvariance!
  lens: Lens!

  """The composable in-layer render graph, if this layer defines one"""
  renderGraph: LayerRenderGraph

  """
  Per pyramid level, the path from that level's voxel grid to this scene's world system. What a multiscale renderer consumes directly: pick a level by zoom and use its path -- every level stars into the same intrinsic system, so the registration tail is shared. A level's path is null when the dataset is not registered into the scene
  """
  levelPaths: [LevelPlacement!]!
}

"""
A container registered into a coordinate system: the data that can be in view of a region asked in it. Deliberately narrower than `residents` -- a pyramid level and a lens are systems *of* a dataset rather than separate things in the space, and including them would return the same data several times
"""
union InViewSource = ArrayDataset | MeshCollection | TableDataset | AnnotationCollection

