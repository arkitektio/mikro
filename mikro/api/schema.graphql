"""
A folder is a collection of the things mikro stores. It mimics a folder in a file system and is the top-level container for organising data.
"""
type Folder @key(fields: "id", resolvable: true) {
  id: ID!
  files(filters: FileFilter, ordering: [FileOrder!]! = [], pagination: OffsetPaginationInput): [File!]!

  """The array datasets filed in this folder"""
  arrayDatasets(filters: ArrayDatasetFilter, ordering: [ArrayDatasetOrder!]! = [], pagination: OffsetPaginationInput): [ArrayDataset!]!

  """The table datasets filed in this folder"""
  tableDatasets(filters: TableDatasetFilter, ordering: [TableDatasetOrder!]! = [], pagination: OffsetPaginationInput): [TableDataset!]!

  """The mesh collections filed in this folder"""
  meshCollections(filters: MeshCollectionFilter, pagination: OffsetPaginationInput): [MeshCollection!]!

  """The annotation collections filed in this folder"""
  annotationCollections(filters: AnnotationCollectionFilter, ordering: [AnnotationCollectionOrder!]! = [], pagination: OffsetPaginationInput): [AnnotationCollection!]!
  parent: Folder
  children(filters: FolderFilter, ordering: [FolderOrder!]! = [], pagination: OffsetPaginationInput): [Folder!]!
  description: String
  name: String!

  """Provenance entries for this folder"""
  provenanceEntries(pagination: OffsetPaginationInput): [ProvenanceEntry!]!
  isDefault: Boolean!
  createdAt: DateTime!
  creator: User

  """The task this folder was created through, if any"""
  createdThrough: Task

  """The assigner of the creating task, if any"""
  createdThroughBy: User
  pinned: Boolean!
  tags: [String!]!
}

"""
Anything filed in a folder: a sub-folder, a file, or one of the four containers
"""
union FolderChild = Folder | File | ArrayDataset | TableDataset | MeshCollection | AnnotationCollection

input FolderChildrenFilter {
  showChildren: Boolean = null
  search: String = null
}

input FolderFilter {
  """Filter by list of IDs"""
  ids: [ID!]

  """
  Search by name (full-text) or by the meaning of the query against name and description. Textual matches rank first, then by similarity; an explicit `ordering` replaces that ranking
  """
  search: String

  """Filter for items created before this datetime"""
  createdBefore: DateTime

  """Filter for items created after this datetime"""
  createdAfter: DateTime

  """Filter by the creator's subject ID"""
  owner: ID

  """Filter by whether the current user has pinned the item"""
  pinned: Boolean

  """Filter by tag names"""
  tags: [String!]

  """Filter by the rekuest task id the item was created through"""
  createdThroughTask: String

  """
  Filter by the database ID of the task the item was created through (the `createdThrough { id }` field)
  """
  createdThrough: ID

  """Filter by the sub of the user that assigned the creating task"""
  assignedBy: ID

  """
  Filter by the database ID of the user that assigned the creating task (the `createdThroughBy { id }` field)
  """
  createdThroughBy: ID
  id: ID
  name: StrFilterLookup
  description: StrFilterLookup
  isDefault: Boolean
  AND: FolderFilter
  OR: FolderFilter
  NOT: FolderFilter
  DISTINCT: Boolean

  """Filter for folders with (true) or without (false) a parent"""
  parentless: Boolean

  """Filter by the parent folder (list the children of a folder)"""
  parent: ID
}

input FolderOrder @oneOf {
  createdAt: Ordering
  name: Ordering
  id: Ordering
}

"""A quantity of frequency (``"50 Hz"``, ``"1 kHz"``)."""
scalar Frequency

"""Input for creating a file record from an uploaded big-file store"""
input FromFileLike {
  """The uploaded big-file store to create the file from"""
  file: FileLike!

  """The name of the file"""
  fileName: String!

  """
  The ID of the folder to put the file in (defaults to the current default folder)
  """
  folder: ID = null

  """The containers this file was written from"""
  exportOf: [ExportOfInput!] = null
}

